name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately NOT installing the full requirements.txt here --
      # it includes MetaTrader5, a Windows-only package that can't
      # install on this Linux runner. requests, supabase, pyjwt,
      # psutil, and openai are the runtime dependencies the current
      # test suite's import chain actually needs (supabase because
      # tests/test_learning_engine.py patches
      # "shared.db.get_client"/"shared.scoped_db.get_scoped_client" by
      # string path, which requires shared/db.py and shared/scoped_db.py
      # -- and their top-level `from supabase import ...` -- to actually
      # import; pyjwt because shared/scoped_db.py also does `import jwt`
      # at module level; psutil because agents/systems/resource_monitor.py
      # imports it at module level, found live 2026-08-18 the same way
      # supabase/pyjwt were found 2026-08-10; openai because every
      # division's _memory_helpers.py does `from openai import APIError`
      # at module level -- found live 2026-08-20 when tests/test_watchtower.py
      # became the first test to import agents/rii/_memory_helpers.py's
      # chain, a pre-existing gap that simply hadn't been exercised
      # before -- passed locally, failed in CI's minimal environment
      # every time this class of gap is found). Add more here only as
      # real tests grow to need them.
      - name: Install dev tooling
        run: pip install -r requirements-dev.txt requests supabase pyjwt psutil openai

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: secret scan
        run: python infrastructure/scripts/secret_scan.py

      - name: pytest
        run: pytest -v
