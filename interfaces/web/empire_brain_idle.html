<title>Empire Brain</title>
<meta name="description" content="AI_EMPIRE's idle-state presence — a dense neural brain on a braided trunk, sweeping green to gold to blue to violet across every division. Served locally by the Systems &amp; Automation server, wired to real data.">

<style>
  :root {
    --void: #030405;
    --void-2: #08090d;
    --panel-bg: rgba(10, 13, 20, 0.72);
    --panel-border: rgba(255, 255, 255, 0.08);
    --ink: #9aa1b5;
    --ink-bright: #eef1fa;
    --ink-dim: #5b6178;
    --ok: #4ee6a0;
    --warn: #ff6b6b;

    --c-rii: #5ec8ff;
    --c-learning: #c77dff;
    --c-fixera: #ffb347;
    --c-forex: #4ee6a0;
    --c-systems: #5a8bff;
    --c-audit: #8b7fd6;
    --c-orch: #ffcf6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse 90% 70% at 55% 30%, var(--void-2), var(--void) 78%);
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--ink);
  }

  .panel {
    position: relative;
    /* bounded by viewport WIDTH and HEIGHT both -- aspect-ratio alone let the
       panel grow taller than the viewport and get cut off/force a scrollbar,
       confirmed live in a real screenshot. 115vh = 92vh converted through the
       5:4 ratio, so height never exceeds 92% of whatever viewport this
       actually renders in. */
    width: min(96vw, 1180px, 115vh);
    aspect-ratio: 5 / 4;
    border-radius: 18px;
    overflow: hidden;
    background: var(--void);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 40px 90px -30px rgba(0,0,0,0.9);
  }

  canvas#brain {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- header ---------- */
  .header {
    position: absolute;
    top: 26px;
    left: 30px;
    z-index: 5;
    max-width: 60%;
  }
  .header .eyebrow {
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  .header h1 {
    margin: 0;
    font-family: "Syne", sans-serif;
    font-weight: 800;
    font-size: clamp(1.3rem, 2.6vw, 1.9rem);
    letter-spacing: 0.1em;
    color: var(--ink-bright);
  }
  .header .divider {
    width: 96px;
    height: 1px;
    margin: 10px 0 10px;
    background: linear-gradient(90deg, var(--c-rii), transparent);
  }
  .header .subtitle {
    margin: 0;
    font-size: 0.72rem;
    color: var(--ink);
    letter-spacing: 0.02em;
  }

  /* ---------- left column cards ----------
     A real bug lived here: card-agents/card-status/quote-block each had
     an independently-guessed `top` percentage. That was fine for a
     shorter division list, but with 7 real divisions the agents card
     grows taller than the 56% gap left for it, and card-status renders
     ON TOP of it (confirmed live via an actual screenshot -- the same
     "measure real bounds, don't assume a fixed constant" lesson as the
     brain silhouette bug, applied to layout this time). Fixed by making
     all three normal-flow children of one flex column instead of three
     separately-positioned absolutes -- this can't overlap regardless of
     how many divisions the list ever grows to. */
  .left-column {
    position: absolute;
    left: 28px;
    top: 106px;
    bottom: 48px;
    z-index: 5;
    width: 220px;
    display: flex;
    flex-direction: column;
    /* Second real overflow found live: even after fixing the top/bottom
       collision above, 7 real division rows + the status card + the quote
       block together were still taller than the space between the header
       and the bottombar, so the tail of the status card and the whole
       quote block spilled past the panel's overflow:hidden edge instead of
       just overlapping visibly. Tightened every gap/padding below to
       actually fit the real content in the real space, verified with a
       live screenshot rather than assumed. */
  }
  .card {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    flex-shrink: 0;
  }
  .card-agents { padding: 9px 12px 8px; }
  .card-status { padding: 9px 14px; margin-top: 8px; }

  .agents-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .agents-title .word {
    font-family: "Syne", sans-serif;
    font-weight: 800;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--ink-bright);
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    color: var(--ok);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px 1px var(--ok);
    animation: dotpulse 2.4s ease-in-out infinite;
  }
  @keyframes dotpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  .division-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .division-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.6rem;
    letter-spacing: 0.03em;
    color: var(--ink);
  }
  .division-list .badge {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1px solid var(--c);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 8px -1px var(--c);
    flex-shrink: 0;
  }
  .division-list .badge svg { width: 8px; height: 8px; color: var(--c); }
  .division-list .name { flex: 1; }
  .division-list .idle {
    font-size: 0.54rem;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
  }
  .division-list .idle.is-down { color: var(--warn); }

  .status-title {
    font-family: "Syne", sans-serif;
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--ink-bright);
    margin: 0 0 6px;
  }
  .stat-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-num {
    font-family: "Syne", sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    color: var(--ink-bright);
  }
  .stat-sub { display: block; font-size: 0.56rem; color: var(--ok); margin-top: 2px; }
  .stat-sub.is-down { color: var(--warn); }

  /* ---------- quote + waveform, bottom-left ---------- */
  .quote-block {
    margin-top: auto; /* flex child of .left-column -- pushes to the bottom of the column, never overlapping the cards above it */
    max-width: 240px;
  }
  .quote-block .quote {
    margin: 0 0 4px;
    font-family: "Syne", sans-serif;
    font-weight: 600;
    font-size: 0.66rem;
    line-height: 1.25;
    color: var(--ink-bright);
    opacity: 0.9;
  }
  .waveform { width: 190px; height: 16px; display: block; }

  /* ---------- bottom bar ---------- */
  .bottombar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: linear-gradient(0deg, rgba(3,4,5,0.85), transparent);
    z-index: 5;
  }
  .bottombar .brand { display: flex; align-items: center; gap: 8px; }
  .bottombar .brand .mark { width: 15px; height: 15px; color: var(--c-orch); }
  .bottombar .brand .word {
    font-family: "Syne", sans-serif;
    font-weight: 800;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--ink-bright);
  }
  .tagline {
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    display: flex;
    gap: 10px;
  }
  .tagline span:nth-child(1) { color: var(--c-rii); }
  .tagline span:nth-child(2) { color: var(--ink-bright); }
  .tagline span:nth-child(3) { color: var(--c-forex); }
  .tagline span:nth-child(4) { color: var(--c-forex); }
  .tagline span:nth-child(5) { color: var(--c-orch); }
  .tagline .dot { color: var(--ink-dim); }

  @media (prefers-reduced-motion: reduce) {
    .status-dot { animation: none !important; }
  }
</style>

<div class="panel" id="panel">
  <canvas id="brain"></canvas>

  <div class="header">
    <p class="eyebrow">Idle Mode</p>
    <h1>EMPIRE BRAIN</h1>
    <div class="divider"></div>
    <p class="subtitle">Always visible, quiet, alive.</p>
  </div>

  <div class="left-column">
    <div class="card card-agents">
      <div class="agents-title">
        <span class="word">AI_EMPIRE</span>
        <span class="status-row"><span class="status-dot"></span>ONLINE</span>
      </div>
      <ul class="division-list" id="divisionList"></ul>
    </div>

    <div class="card card-status">
      <p class="status-title">EMPIRE STATUS</p>
      <div class="stat-row"><span>Active Tasks</span><span class="stat-num" id="statActivity">—</span></div>
      <div class="stat-row"><span>Agents Online</span><span class="stat-num" id="statServices">—</span></div>
      <div class="stat-row"><span>Alerts</span><span class="stat-num" id="statAlerts">—</span></div>
      <div style="text-align:right;"><span class="stat-sub" id="statSub">connecting...</span></div>
    </div>

    <div class="quote-block">
      <p class="quote">&ldquo;The empire works,<br>so you can think bigger.&rdquo;</p>
      <svg class="waveform" viewBox="0 0 190 24" preserveAspectRatio="none" id="waveform"></svg>
    </div>
  </div>

  <div class="bottombar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2 L14.5 8.2 L21 9 L16 13.4 L17.5 20 L12 16.6 L6.5 20 L8 13.4 L3 9 L9.5 8.2 Z" fill="currentColor"/>
      </svg>
      <span class="word">AI_EMPIRE</span>
    </div>
    <div class="tagline">
      <span>THINK</span><span class="dot">&middot;</span>
      <span>BUILD</span><span class="dot">&middot;</span>
      <span>LEARN</span><span class="dot">&middot;</span>
      <span>GROW</span><span class="dot">&middot;</span>
      <span>PROTECT</span>
    </div>
  </div>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
(function () {
  var STAR = 'M12 2 L14.5 8.2 L21 9 L16 13.4 L17.5 20 L12 16.6 L6.5 20 L8 13.4 L3 9 L9.5 8.2 Z';
  // key matches shared/systems_db_connector.py's get_empire_status()
  // division keys exactly -- real backend state is looked up by this,
  // not guessed from the display name.
  var DIVISIONS = [
    { key: 'rii',          name: 'RII',          color: '#5ec8ff' },
    { key: 'learning',     name: 'Learning',     color: '#c77dff' },
    { key: 'fixera',       name: 'Fixera',       color: '#ffb347' },
    { key: 'forex',        name: 'Forex',        color: '#4ee6a0' },
    { key: 'systems',      name: 'Systems',      color: '#5a8bff' },
    { key: 'audit',        name: 'Audit',        color: '#8b7fd6' },
    { key: 'orchestrator', name: 'Orchestrator', color: '#ffcf6b' }
  ];

  var list = document.getElementById('divisionList');
  var idleLabels = {};
  DIVISIONS.forEach(function (d) {
    var li = document.createElement('li');
    li.style.setProperty('--c', d.color);
    var idleId = 'idle-' + d.key;
    li.innerHTML =
      '<span class="badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="' + STAR + '"/></svg></span>' +
      '<span class="name">' + d.name.toUpperCase() + '</span>' +
      '<span class="idle" id="' + idleId + '">IDLE</span>';
    list.appendChild(li);
    idleLabels[d.key] = document.getElementById(idleId);
  });

  // ---- real data: polls the Systems & Automation server's own
  // /empire-status endpoint (same origin -- this page IS served by that
  // server at /brain), which reads circuit_breakers/audit_vault live.
  // No fabricated numbers: on fetch failure the stat cells just show
  // "—" and the sub-line says so, rather than silently keeping stale or
  // invented values on screen.
  var statServices = document.getElementById('statServices');
  var statAlerts = document.getElementById('statAlerts');
  var statActivity = document.getElementById('statActivity');
  var statSub = document.getElementById('statSub');
  var POLL_MS = 20000;

  function applyStatus(data) {
    statServices.textContent = data.services_online + '/' + data.services_total;
    statAlerts.textContent = data.alerts;
    statAlerts.style.color = data.alerts > 0 ? 'var(--warn)' : 'var(--ink-bright)';
    // "Active Tasks" has no real task-queue backing yet (job_queue exists
    // in the schema but nothing writes to it today) -- proxied honestly by
    // real audit_vault activity in the last hour rather than a fabricated
    // number. Revisit if/when job_queue is actually used.
    statActivity.textContent = data.recent_activity_1h;
    if (data.alerts > 0) {
      statSub.textContent = data.alerts + ' service(s) need attention';
      statSub.classList.add('is-down');
    } else {
      statSub.textContent = 'All systems normal';
      statSub.classList.remove('is-down');
    }

    Object.keys(idleLabels).forEach(function (key) {
      var el = idleLabels[key];
      var state = data.divisions[key];
      if (state === 'healthy') {
        el.textContent = 'IDLE';
        el.classList.remove('is-down');
      } else if (state) {
        el.textContent = state.toUpperCase().replace('_', ' ');
        el.classList.add('is-down');
      } else {
        el.textContent = 'UNKNOWN';
        el.classList.remove('is-down');
      }
    });
  }

  function pollStatus() {
    fetch('/empire-status')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(applyStatus)
      .catch(function (err) {
        statSub.textContent = 'live data unavailable';
        statSub.classList.add('is-down');
        console.warn('empire-status fetch failed:', err);
      });
  }
  pollStatus();
  setInterval(pollStatus, POLL_MS);

  // animated waveform (SVG polyline redrawn each frame)
  var wfSvg = document.getElementById('waveform');
  var wfNS = 'http://www.w3.org/2000/svg';
  var wfLine = document.createElementNS(wfNS, 'polyline');
  wfLine.setAttribute('fill', 'none');
  wfLine.setAttribute('stroke', '#5ec8ff');
  wfLine.setAttribute('stroke-width', '1.2');
  wfLine.setAttribute('opacity', '0.75');
  wfSvg.appendChild(wfLine);
  var wfT = 0;
  function drawWave() {
    wfT += 0.05;
    var pts = [];
    for (var x = 0; x <= 190; x += 6) {
      var y = 12 + Math.sin(x * 0.13 + wfT) * 4.5 * Math.sin(wfT * 0.4 + x * 0.02);
      pts.push(x + ',' + y.toFixed(1));
    }
    wfLine.setAttribute('points', pts.join(' '));
    requestAnimationFrame(drawWave);
  }
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) drawWave();

  /* ================= brain particle construct ================= */
  var canvas = document.getElementById('brain');
  var ctx = canvas.getContext('2d');
  var panel = document.getElementById('panel');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W, H;

  function resize() {
    var r = panel.getBoundingClientRect();
    W = canvas.width = Math.round(r.width * dpr);
    H = canvas.height = Math.round(r.height * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---- color: a left-to-right sweep (green -> gold -> blue -> violet),
  // the trunk pulled toward warm gold regardless of x -- matches the
  // reference far more closely than the old height-only blend did.
  //
  // Real bug found from TWO live screenshots, not one guess: the canopy's
  // real ux extent only spans roughly u=0.10 to u=0.90 (measured from the
  // actual blob geometry below, not assumed), and green->gold at 0.28 left
  // barely any of that range for green before blending into gold -- most
  // canopy points landed past the gold stop already, so green never
  // covered enough area to read as its own color next to the surrounding
  // gold glow. Pushed the gold stop out to 0.45 to give green real room,
  // and made the green itself less teal/more a pure spring-green so it
  // doesn't get confused with the blue stop further along the sweep.
  var STOPS = [
    [0.00, [70, 230, 110]],   // green
    [0.45, [255, 179, 71]],   // gold
    [0.68, [94, 200, 255]],   // blue
    [1.00, [199, 125, 255]]   // violet
  ];
  function horizColor(u) {
    u = Math.min(1, Math.max(0, u));
    for (var i = 0; i < STOPS.length - 1; i++) {
      var a = STOPS[i], b = STOPS[i + 1];
      if (u >= a[0] && u <= b[0]) {
        var t = (u - a[0]) / (b[0] - a[0]);
        return [lerp(a[1][0], b[1][0], t), lerp(a[1][1], b[1][1], t), lerp(a[1][2], b[1][2], t)];
      }
    }
    return STOPS[STOPS.length - 1][1];
  }
  var GOLD = [255, 179, 71];
  function mixColor(uy, ux) {
    var u = (ux + 1) / 2;
    var hc = horizColor(u);
    var trunkW = Math.max(0, 1 - uy / 0.5); // strong near the base, gone by uy=0.5
    var r = lerp(hc[0], GOLD[0], trunkW);
    var g = lerp(hc[1], GOLD[1], trunkW);
    var b = lerp(hc[2], GOLD[2], trunkW);
    return 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
  }

  // ---- canopy: a real brain silhouette, rasterized then sampled (proven
  // technique -- guarantees the macro-shape reads as a brain) ----
  var OFFW = 300, OFFH = 260;
  var off = document.createElement('canvas');
  off.width = OFFW; off.height = OFFH;
  var offCtx = off.getContext('2d');
  offCtx.fillStyle = '#fff';
  function blob(cx, cy, r) {
    offCtx.beginPath();
    offCtx.arc(cx, cy, r, 0, Math.PI * 2);
    offCtx.fill();
  }
  // Bigger, wider-set hemispheres than the first pass -- a live
  // screenshot showed the brain reading as small/sparse relative to the
  // panel next to the reference, which fills most of the panel's height.
  blob(105, 98, 74); blob(195, 98, 74);
  blob(150, 34, 34); blob(85, 48, 34); blob(215, 48, 34);
  blob(62, 92, 27); blob(238, 92, 27);
  blob(72, 140, 30); blob(228, 140, 30);
  blob(150, 172, 27);
  blob(115, 36, 20); blob(185, 36, 20);
  // extra lower bulges so the canopy flares wider right above the trunk,
  // reading as roots branching rather than a canopy sitting on a stick
  blob(96, 158, 22); blob(204, 158, 22);

  var img = offCtx.getImageData(0, 0, OFFW, OFFH).data;

  // Real bug from the first render: uyRaw was computed against the FULL
  // offscreen canvas height, but the lowest blob only reaches ~74% of the
  // way down it -- so real canopy content never touched uyRaw=0, leaving an
  // unbridged gap between the trunk's designed endpoint and where the
  // canopy actually began (the disconnected floating-brain-over-stick-figure
  // screenshot). Fixed by measuring the real alpha bounding box first, so
  // the mapping is derived from actual pixels, never assumed.
  var minPy = OFFH, maxPy = 0;
  for (var sy = 0; sy < OFFH; sy++) {
    for (var sx = 0; sx < OFFW; sx++) {
      if (img[(sy * OFFW + sx) * 4 + 3] >= 128) {
        if (sy < minPy) minPy = sy;
        if (sy > maxPy) maxPy = sy;
      }
    }
  }

  var CANOPY_TOP_UY = 0.98, CANOPY_BASE_UY = 0.46; // where the canopy silhouette meets the trunk
  var nodes = [];
  var STRIDE = 4;
  for (var py = 0; py < OFFH; py += STRIDE) {
    for (var px = 0; px < OFFW; px += STRIDE) {
      var alpha = img[(py * OFFW + px) * 4 + 3];
      if (alpha < 128) continue;
      // kept-probability raised from the first pass's 0.58 -- a live
      // screenshot showed the canopy reading sparse next to the reference's
      // dense point-cloud.
      if (Math.random() < 0.32) continue;
      var ux = ((px + (Math.random()-0.5)*STRIDE) / OFFW - 0.5) * 2;
      var uyRaw = 1 - (py - minPy) / (maxPy - minPy); // 0 = real lowest canopy pixel, 1 = real highest
      var uy = lerp(CANOPY_BASE_UY, CANOPY_TOP_UY, uyRaw);
      nodes.push({ ux: ux, uy: uy, color: mixColor(uy, ux) });
    }
  }

  // ---- trunk: eight strands rising from the dais, widest at the base and
  // tapering as they near the canopy -- reads as roots spreading into the
  // ground rather than a uniform braided column (the reference's trunk
  // visibly flares at its base, the first pass's fixed-width braid didn't).
  var STRANDS = 8;
  for (var si = 0; si < STRANDS; si++) {
    var phase = (si / STRANDS) * Math.PI * 2;
    var steps = 60;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var uy = t * CANOPY_BASE_UY;
      var spread = 0.17 * Math.pow(1 - t, 1.6) + 0.016; // wide at t=0 (dais), narrow by t=1 (canopy)
      var ux = Math.sin(t * Math.PI * 2.4 + phase) * spread;
      nodes.push({ ux: ux, uy: uy, color: mixColor(uy, ux) });
    }
  }

  // connect each point to its ~2 nearest neighbors -- the neural-mesh
  // texture. Bucketed into a uniform grid (cell = MAX_LINK_DIST) instead of
  // the first pass's checking every node against every other node -- that
  // was O(n^2) and stayed fast enough at ~3.2k nodes, but the density
  // increase above roughly doubles node count, and an O(n^2) scan doesn't
  // scale gracefully; bucketing keeps this a one-time, sub-second cost
  // regardless of how dense the cloud gets.
  var segs = [];
  var seenPairs = {};
  var MAX_LINK_DIST = 0.10;
  var grid = {};
  function cellKey(cx, cy) { return cx + '_' + cy; }
  for (var gi = 0; gi < nodes.length; gi++) {
    var gx = Math.floor(nodes[gi].ux / MAX_LINK_DIST), gy = Math.floor(nodes[gi].uy / MAX_LINK_DIST);
    var key = cellKey(gx, gy);
    (grid[key] || (grid[key] = [])).push(gi);
  }
  for (var a = 0; a < nodes.length; a++) {
    var acx = Math.floor(nodes[a].ux / MAX_LINK_DIST), acy = Math.floor(nodes[a].uy / MAX_LINK_DIST);
    var dists = [];
    for (var ncx = acx - 1; ncx <= acx + 1; ncx++) {
      for (var ncy = acy - 1; ncy <= acy + 1; ncy++) {
        var bucket = grid[cellKey(ncx, ncy)];
        if (!bucket) continue;
        for (var bk = 0; bk < bucket.length; bk++) {
          var bI = bucket[bk];
          if (bI === a) continue;
          var dx = nodes[a].ux - nodes[bI].ux, dy = nodes[a].uy - nodes[bI].uy;
          var d = Math.sqrt(dx*dx + dy*dy);
          if (d < MAX_LINK_DIST) dists.push([d, bI]);
        }
      }
    }
    dists.sort(function (p, q) { return p[0] - q[0]; });
    var linkCount = Math.min(2, dists.length);
    for (var k = 0; k < linkCount; k++) {
      var bIdx = dists[k][1];
      var key = a < bIdx ? a + '_' + bIdx : bIdx + '_' + a;
      if (seenPairs[key]) continue;
      seenPairs[key] = true;
      segs.push({ a: a, b: bIdx });
    }
  }

  // ---- formation timing: trunk (low uy) first, canopy (high uy) last ----
  var FORM_DURATION = 4200;
  nodes.forEach(function (n) {
    var t0 = n.uy * 0.62;
    n.startAt = t0 * FORM_DURATION + Math.random() * 220;
    n.dur = 650 + Math.random() * 400;
    n.sx = (Math.random() * 2 - 1);
    n.sy = (Math.random() * 2 - 1) * 0.9 + 0.1;
    n.jx = Math.random() * Math.PI * 2;
    n.jy = Math.random() * Math.PI * 2;
    n.pulsePhase = Math.random() * Math.PI * 2;
  });

  function ease(t) { return 1 - Math.pow(1 - t, 3); }

  function unitToPx(ux, uy) {
    // brain sits right-of-center, leaving room for the left column; uy=0 is
    // the dais, uy=1 is the canopy top. Span raised from 0.34/0.70 -- a live
    // screenshot showed the brain occupying a noticeably smaller fraction of
    // the panel than the reference, which lets it dominate the composition.
    var cx = W * 0.63;
    var baseY = H * 0.90;
    var spanX = W * 0.40;
    var spanY = H * 0.80;
    return [cx + ux * spanX, baseY - uy * spanY];
  }

  var start = performance.now();
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function drawDais(px, py, glow) {
    ctx.save();
    for (var i = 0; i < 3; i++) {
      var rw = (78 + i * 28) * dpr;
      var rh = rw * 0.22;
      ctx.beginPath();
      ctx.ellipse(px, py + 6*dpr, rw, rh, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,207,107,' + (0.5 - i * 0.14) * glow + ')';
      ctx.lineWidth = 1.4 * dpr;
      ctx.stroke();
    }
    var glowGrad = ctx.createRadialGradient(px, py, 0, px, py, 110 * dpr);
    glowGrad.addColorStop(0, 'rgba(255,180,80,' + 0.35 * glow + ')');
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.ellipse(px, py, 110*dpr, 28*dpr, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    var el = now - start;
    ctx.clearRect(0, 0, W, H);

    var basePx = unitToPx(0, 0);
    var formProgress = Math.min(1, el / (FORM_DURATION + 600));
    drawDais(basePx[0], basePx[1], 0.5 + 0.5 * formProgress);

    var pos = new Array(nodes.length);
    var arrived = new Array(nodes.length);
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var t = reduceMotion ? 1 : Math.max(0, Math.min(1, (el - n.startAt) / n.dur));
      var e = ease(t);
      var fx = lerp(n.sx, n.ux, e);
      var fy = lerp(n.sy, n.uy, e);
      pos[i] = unitToPx(fx, fy);
      arrived[i] = t;
    }

    var settledGlobal = Math.min(1, Math.max(0, (el - FORM_DURATION) / 900));

    ctx.lineCap = 'round';
    for (var s = 0; s < segs.length; s++) {
      var A = segs[s].a, B = segs[s].b;
      var op = Math.min(arrived[A], arrived[B]);
      if (op <= 0) continue;
      var nB = nodes[B];
      ctx.beginPath();
      ctx.moveTo(pos[A][0], pos[A][1]);
      ctx.lineTo(pos[B][0], pos[B][1]);
      ctx.strokeStyle = nB.color;
      ctx.globalAlpha = op * 0.55;
      ctx.lineWidth = Math.max(0.55, 1.7 - nB.uy * 0.8) * dpr;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (var j = 0; j < nodes.length; j++) {
      var nn = nodes[j];
      if (arrived[j] <= 0) continue;
      var p = pos[j];
      var jitterAmt = settledGlobal * 1.4 * dpr;
      var jx = Math.sin(el * 0.0011 + nn.jx) * jitterAmt;
      var jy = Math.cos(el * 0.0013 + nn.jy) * jitterAmt;
      var pulse = 0.75 + 0.25 * Math.sin(el * 0.0018 + nn.pulsePhase);
      var r = Math.max(1.3, 2.5 - nn.uy * 0.8) * dpr * pulse;

      var glow = ctx.createRadialGradient(p[0]+jx, p[1]+jy, 0, p[0]+jx, p[1]+jy, r * 5);
      glow.addColorStop(0, nn.color);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.globalAlpha = arrived[j] * 0.9;
      ctx.beginPath();
      ctx.arc(p[0]+jx, p[1]+jy, r * 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = arrived[j];
      ctx.fillStyle = nn.color;
      ctx.beginPath();
      ctx.arc(p[0]+jx, p[1]+jy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (!reduceMotion) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
