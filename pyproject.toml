[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "node_modules", "_tmp_verify_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by the formatter, not the linter
    "E402",  # every server.py deliberately calls load_dotenv() before importing
             # modules that read env vars at import time -- a real architectural
             # pattern in this codebase, not something to ever "fix"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `agents.*`/`shared.*` imports work regardless of how
                     # pytest is invoked -- `python -m pytest` adds cwd to
                     # sys.path automatically, but the bare `pytest` command
                     # (what CI runs) doesn't
